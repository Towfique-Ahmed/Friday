# Optional: PostgreSQL for production-style local development.
# Not required to run the app (SQLite is the default) — use this if you've
# switched prisma/schema.prisma's datasource provider to "postgresql".
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: friday
      POSTGRES_PASSWORD: friday
      POSTGRES_DB: friday
    ports:
      - "5432:5432"
    volumes:
      - friday_postgres_data:/var/lib/postgresql/data

volumes:
  friday_postgres_data:
